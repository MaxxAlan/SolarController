<svg width="1800" height="1820" viewBox="0 0 1800 1820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title Header -->
  <rect x="80" y="25" width="1640" height="75" rx="8" fill="#0f172a"/>
  <text x="900" y="58" fill="#38bdf8" font-size="22" font-weight="bold" text-anchor="middle">LƯU ĐỒ THUẬT TOÁN HỆ THỐNG ĐIỀU KHIỂN PIN MẶT TRỜI (SOLAR TRACKER)</text>
  <text x="900" y="83" fill="#94a3b8" font-size="14" text-anchor="middle">ESP32-S3 Wi-Fi | Firebase Realtime Cloud Dashboard | Tự động bám sáng &amp; Chế độ Failsafe Offline</text>

  <!-- ================= STAGE 1: KHỞI TẠO ================= -->
  <!-- Start -->
  <rect x="790" y="125" width="220" height="46" rx="23" fill="#10b981" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="154" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Bắt đầu (Power ON / Boot)</text>

  <!-- Line Start -> Init -->
  <line x1="900" y1="171" x2="900" y2="205" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Init System -->
  <rect x="700" y="205" width="400" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="230" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">Khởi tạo hệ thống (Setup)</text>
  <text x="900" y="248" fill="#475569" font-size="12" text-anchor="middle">(Cấu hình GPIO, 4 kênh ADC, PWM Servo, Watchdog Timer)</text>

  <!-- Line Init -> Net -->
  <line x1="900" y1="259" x2="900" y2="295" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Connect Wi-Fi & Firebase -->
  <rect x="700" y="295" width="400" height="54" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="320" fill="#0369a1" font-size="14" font-weight="bold" text-anchor="middle">Kết nối Wi-Fi &amp; Đồng bộ Firebase RTDB</text>
  <text x="900" y="338" fill="#0284c7" font-size="12" text-anchor="middle">(Khởi tạo Stream Listener /controls từ Cloud)</text>

  <!-- Line Net -> Loop Entry -->
  <line x1="900" y1="349" x2="900" y2="390" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop Entry Junction -->
  <circle cx="900" cy="390" r="4" fill="#1e293b"/>

  <line x1="900" y1="390" x2="900" y2="415" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Có kết nối mạng? -->
  <polygon points="900,415 1060,465 900,515 740,465" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="458" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Đã kết nối Wi-Fi &amp;</text>
  <text x="900" y="476" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Firebase khả dụng?</text>

  <!-- Q_Net -> Không (Offline) -->
  <line x1="740" y1="465" x2="450" y2="465" stroke="#1e293b" stroke-width="2"/>
  <line x1="450" y1="465" x2="450" y2="530" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="457" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">Không (Offline)</text>

  <!-- Act Offline Failsafe -->
  <rect x="280" y="530" width="340" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="555" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">Kích hoạt chế độ dự phòng Offline</text>
  <text x="450" y="574" fill="#ef4444" font-size="12" text-anchor="middle">(Tự động bám sáng độc lập, thử kết nối lại ngầm)</text>

  <!-- Q_Net -> Có (Online) -->
  <line x1="900" y1="515" x2="900" y2="555" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="925" y="538" fill="#16a34a" font-size="13" font-weight="bold">Có (Online)</text>

  <!-- Read Command from Dashboard -->
  <rect x="710" y="555" width="380" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="580" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Đọc lệnh điều khiển từ Firebase RTDB</text>
  <text x="900" y="598" fill="#475569" font-size="12" text-anchor="middle">Node /controls: Chế độ (Auto/Manual), Góc mục tiêu, Dừng khẩn</text>

  <!-- Merge offline & online to read sensor -->
  <line x1="450" y1="586" x2="450" y2="655" stroke="#1e293b" stroke-width="2"/>
  <line x1="450" y1="655" x2="710" y2="675" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="611" x2="900" y2="650" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 2: CẢM BIẾN ================= -->
  <!-- Read Sensors Box -->
  <rect x="710" y="650" width="380" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="675" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">Đọc &amp; Xử lý tín hiệu cảm biến</text>
  <text x="900" y="693" fill="#475569" font-size="12" text-anchor="middle">(Lọc nhiễu trung bình trượt tín hiệu ADC)</text>

  <!-- Input LDR Parallelogram -->
  <polygon points="170,655 450,655 420,700 140,700" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="295" y="677" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">4 Cảm biến quang trở (LDR)</text>
  <text x="295" y="693" fill="#64748b" font-size="11" text-anchor="middle">(Top-Left, Top-Right, Bottom-Left, Bottom-Right)</text>
  <line x1="435" y1="677" x2="710" y2="677" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Input Battery Parallelogram -->
  <polygon points="170,720 450,720 420,765 140,765" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="295" y="742" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">Điện áp Pin 18650 &amp; Năng lượng</text>
  <text x="295" y="758" fill="#64748b" font-size="11" text-anchor="middle">(Đo qua mạch Cầu phân áp ADC - TP4056)</text>
  <line x1="435" y1="742" x2="710" y2="690" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Input Servo Angle Parallelogram -->
  <polygon points="1370,655 1650,655 1620,700 1340,700" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1495" y="677" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">Góc quay hiện tại của Servo</text>
  <text x="1495" y="693" fill="#64748b" font-size="11" text-anchor="middle">(Phản hồi vị trí góc 0° đến 180°)</text>
  <line x1="1355" y1="677" x2="1090" y2="677" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Line Read Sensor -> Q_Auto -->
  <line x1="900" y1="704" x2="900" y2="755" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 3: ĐIỀU HƯỚNG CHẾ ĐỘ ================= -->
  <!-- Decision: Is Auto Mode? -->
  <polygon points="900,755 1040,805 900,855 760,805" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="800" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Đang ở chế độ</text>
  <text x="900" y="818" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Tự động (Auto Mode)?</text>

  <!-- Q_Auto -> Không (Manual Mode) -->
  <line x1="760" y1="805" x2="250" y2="805" stroke="#1e293b" stroke-width="2"/>
  <line x1="250" y1="805" x2="250" y2="905" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="797" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">Không (Manual Mode)</text>

  <!-- Act Manual -->
  <rect x="100" y="905" width="300" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="932" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Điều khiển xoay Servo thủ công</text>
  <text x="250" y="951" fill="#475569" font-size="12" text-anchor="middle">Theo góc targetAngle đặt trên Web (0° - 180°)</text>

  <!-- Q_Auto -> Có (Auto Mode) -->
  <line x1="900" y1="855" x2="900" y2="905" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="925" y="885" fill="#16a34a" font-size="13" font-weight="bold">Có</text>

  <!-- Decision: Sự cố / Pin yếu? -->
  <polygon points="900,905 1040,960 900,1015 760,960" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="953" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Pin cạn (&lt; 3.3V) hoặc</text>
  <text x="900" y="971" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">lỗi cảm biến / kẹt motor?</text>

  <!-- Q_Fault -> Có (Fault Detected) -->
  <line x1="760" y1="960" x2="560" y2="960" stroke="#1e293b" stroke-width="2"/>
  <line x1="560" y1="960" x2="560" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="952" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">Có (Sự cố)</text>

  <!-- Act Fault Stop & Alarm -->
  <rect x="420" y="1055" width="280" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="1079" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">Ngắt động cơ Servo hoàn toàn</text>
  <text x="560" y="1097" fill="#ef4444" font-size="12" text-anchor="middle">Vào chế độ an toàn (Safe Mode / Low Power)</text>

  <line x1="560" y1="1107" x2="560" y2="1140" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="1140" width="280" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="1163" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">Gửi cảnh báo lỗi khẩn cấp</text>
  <text x="560" y="1181" fill="#ef4444" font-size="12" text-anchor="middle">Đẩy Notification lên Firebase Web Dashboard</text>

  <!-- Q_Fault -> Không (Normal) -->
  <line x1="1040" y1="960" x2="1180" y2="960" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1100" y="952" fill="#16a34a" font-size="13" font-weight="bold" text-anchor="middle">Không</text>

  <!-- Decision: Trời tối? -->
  <polygon points="1280,905 1395,960 1280,1015 1165,960" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1280" y="953" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Ánh sáng &lt; Ngưỡng</text>
  <text x="1280" y="971" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">ban đêm (Trời tối)?</text>

  <!-- Q_Night -> Có (Ban đêm) -->
  <line x1="1280" y1="1015" x2="1280" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1305" y="1037" fill="#16a34a" font-size="13" font-weight="bold">Có</text>

  <!-- Act Night East & Sleep -->
  <rect x="1145" y="1055" width="270" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1280" y="1078" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">Quay tấm pin về hướng Đông</text>
  <text x="1280" y="1096" fill="#3b82f6" font-size="12" text-anchor="middle">(Vị trí đón bình minh mặc định ~0°)</text>

  <line x1="1280" y1="1107" x2="1280" y2="1140" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1145" y="1140" width="270" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1280" y="1163" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">Vào chế độ ngủ chờ (Sleep)</text>
  <text x="1280" y="1181" fill="#3b82f6" font-size="12" text-anchor="middle">(Tắt cấp xung Servo để tiết kiệm điện)</text>

  <!-- Q_Night -> Không (Ban ngày có nắng) -->
  <line x1="1395" y1="960" x2="1485" y2="960" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1440" y="952" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">Không</text>

  <!-- Decision: Sai lệch >= Deadband? -->
  <polygon points="1585,905 1705,960 1585,1015 1465,960" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1585" y="953" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">Sai lệch sáng &gt;=</text>
  <text x="1585" y="971" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">Deadband (|L-R| &gt; ε)?</text>

  <!-- Q_Track -> Không (Giữ nguyên góc) -->
  <line x1="1515" y1="995" x2="1515" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1480" y="1030" fill="#64748b" font-size="12" font-weight="bold">Không</text>

  <rect x="1445" y="1055" width="140" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="1515" y="1080" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Giữ nguyên góc</text>
  <text x="1515" y="1098" fill="#64748b" font-size="11" text-anchor="middle">(Servo nghỉ)</text>

  <!-- Q_Track -> Có (Xoay bám nắng) -->
  <line x1="1645" y1="995" x2="1645" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1655" y="1030" fill="#16a34a" font-size="12" font-weight="bold">Có</text>

  <rect x="1595" y="1055" width="140" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1665" y="1080" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">Xoay Servo</text>
  <text x="1665" y="1098" fill="#16a34a" font-size="11" text-anchor="middle">(Bám cực đại sáng)</text>

  <!-- Merge Hold & Rotate to Battery Monitor -->
  <line x1="1515" y1="1111" x2="1515" y2="1140" stroke="#1e293b" stroke-width="2"/>
  <line x1="1665" y1="1111" x2="1665" y2="1140" stroke="#1e293b" stroke-width="2"/>
  <line x1="1515" y1="1140" x2="1665" y2="1140" stroke="#1e293b" stroke-width="2"/>
  <line x1="1590" y1="1140" x2="1590" y2="1170" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bat Mon Action -->
  <rect x="1455" y="1170" width="270" height="52" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="1590" y="1193" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Giám sát Điện áp Pin &amp; Nguồn sạc</text>
  <text x="1590" y="1211" fill="#475569" font-size="12" text-anchor="middle">Tính % dung lượng SOC từ ADC, theo dõi TP4056</text>

  <!-- ================= STAGE 4: BUS ĐỒNG BỘ TELEMETRY ================= -->
  <!-- Horizontal Bus routing lines from all 4 branches down to Telemetry -->
  <line x1="250" y1="965" x2="250" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="560" y1="1192" x2="560" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="1280" y1="1192" x2="1280" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="1590" y1="1222" x2="1590" y2="1285" stroke="#1e293b" stroke-width="2"/>

  <!-- Main horizontal collection bus -->
  <line x1="250" y1="1285" x2="1590" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="900" y1="1285" x2="900" y2="1325" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Có kết nối mạng để gửi Cloud? -->
  <polygon points="900,1325 1030,1370 900,1415 770,1370" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="1363" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Có kết nối Wi-Fi &amp;</text>
  <text x="900" y="1381" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Firebase khả dụng?</text>

  <!-- Q_Net2 -> Có (Đẩy dữ liệu lên Firebase) -->
  <line x1="900" y1="1415" x2="900" y2="1455" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="925" y="1437" fill="#16a34a" font-size="13" font-weight="bold">Có</text>

  <rect x="690" y="1455" width="420" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="1481" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">Đẩy Telemetry lên Firebase RTDB (/telemetry)</text>
  <text x="900" y="1501" fill="#16a34a" font-size="12" text-anchor="middle">Điện áp Pin, SOC %, 4 giá trị LDR, Góc servo, Trạng thái hệ thống</text>

  <!-- Q_Net2 -> Không (Bỏ qua đẩy Cloud) -->
  <line x1="770" y1="1370" x2="600" y2="1370" stroke="#1e293b" stroke-width="2"/>
  <line x1="600" y1="1370" x2="600" y2="1545" stroke="#1e293b" stroke-width="2"/>
  <text x="670" y="1362" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">Không</text>

  <!-- Merge to Delay -->
  <line x1="900" y1="1515" x2="900" y2="1545" stroke="#1e293b" stroke-width="2"/>
  <line x1="600" y1="1545" x2="900" y2="1545" stroke="#1e293b" stroke-width="2"/>
  <line x1="900" y1="1545" x2="900" y2="1575" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop Delay -->
  <rect x="750" y="1575" width="300" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="1603" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Trễ chu kỳ lấy mẫu (Delay 500ms - 1s)</text>

  <!-- ================= INFINITE LOOP ROUTING ================= -->
  <!-- Line down from Delay -->
  <line x1="900" y1="1621" x2="900" y2="1670" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Line left across bottom -->
  <line x1="900" y1="1670" x2="70" y2="1670" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Line up along left side -->
  <line x1="70" y1="1670" x2="70" y2="390" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Line right to loop entry point above Q_Net -->
  <line x1="70" y1="390" x2="890" y2="390" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Badge for Infinite loop -->
  <rect x="120" y="1645" width="520" height="34" rx="6" fill="#0284c7" filter="url(#shadow)"/>
  <text x="380" y="1667" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">VÒNG LẶP HỆ THỐNG LIÊN TỤC (EMBEDDED INFINITE LOOP - void loop)</text>

</svg>