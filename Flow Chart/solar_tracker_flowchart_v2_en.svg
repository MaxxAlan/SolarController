<svg width="1800" height="1820" viewBox="0 0 1800 1820" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0284c7"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- Title Header -->
  <rect x="80" y="25" width="1640" height="75" rx="8" fill="#0f172a"/>
  <text x="900" y="58" fill="#38bdf8" font-size="22" font-weight="bold" text-anchor="middle">SOLAR TRACKER CONTROLLER SYSTEM FLOWCHART</text>
  <text x="900" y="83" fill="#94a3b8" font-size="14" text-anchor="middle">ESP32-S3 Wi-Fi | Firebase Realtime Cloud Dashboard | Auto Sun Tracking &amp; Offline Failsafe</text>

  <!-- ================= STAGE 1: INITIALIZATION ================= -->
  <!-- Start -->
  <rect x="790" y="125" width="220" height="46" rx="23" fill="#10b981" stroke="#059669" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="154" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">Start (Power ON / Boot)</text>

  <!-- Line Start -> Init -->
  <line x1="900" y1="171" x2="900" y2="205" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Init System -->
  <rect x="700" y="205" width="400" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="230" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">System Initialization (Setup)</text>
  <text x="900" y="248" fill="#475569" font-size="12" text-anchor="middle">(Configure GPIOs, 4 ADC Channels, Servo PWM, Watchdog Timer)</text>

  <!-- Line Init -> Net -->
  <line x1="900" y1="259" x2="900" y2="295" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Connect Wi-Fi & Firebase -->
  <rect x="700" y="295" width="400" height="54" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="320" fill="#0369a1" font-size="14" font-weight="bold" text-anchor="middle">Connect Wi-Fi &amp; Sync Firebase RTDB</text>
  <text x="900" y="338" fill="#0284c7" font-size="12" text-anchor="middle">(Initialize Stream Listener for /controls from Cloud)</text>

  <!-- Line Net -> Loop Entry -->
  <line x1="900" y1="349" x2="900" y2="390" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop Entry Junction -->
  <circle cx="900" cy="390" r="4" fill="#1e293b"/>

  <line x1="900" y1="390" x2="900" y2="415" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Is Network Connected? -->
  <polygon points="900,415 1060,465 900,515 740,465" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="458" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Wi-Fi &amp; Firebase</text>
  <text x="900" y="476" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Connected &amp; Available?</text>

  <!-- Q_Net -> No (Offline) -->
  <line x1="740" y1="465" x2="450" y2="465" stroke="#1e293b" stroke-width="2"/>
  <line x1="450" y1="465" x2="450" y2="530" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="590" y="457" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">No (Offline)</text>

  <!-- Act Offline Failsafe -->
  <rect x="280" y="530" width="340" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="450" y="555" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">Activate Offline Failsafe Mode</text>
  <text x="450" y="574" fill="#ef4444" font-size="12" text-anchor="middle">(Autonomous local sun tracking, background auto-reconnect)</text>

  <!-- Q_Net -> Yes (Online) -->
  <line x1="900" y1="515" x2="900" y2="555" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="925" y="538" fill="#16a34a" font-size="13" font-weight="bold">Yes (Online)</text>

  <!-- Read Command from Dashboard -->
  <rect x="710" y="555" width="380" height="56" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="580" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Read Commands from Firebase RTDB</text>
  <text x="900" y="598" fill="#475569" font-size="12" text-anchor="middle">Node /controls: Mode (Auto/Manual), Target Angle, Emergency Stop</text>

  <!-- Merge offline & online to read sensor -->
  <line x1="450" y1="586" x2="450" y2="655" stroke="#1e293b" stroke-width="2"/>
  <line x1="450" y1="655" x2="710" y2="675" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="611" x2="900" y2="650" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 2: SENSORS ================= -->
  <!-- Read Sensors Box -->
  <rect x="710" y="650" width="380" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="675" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">Read &amp; Process Sensor Signals</text>
  <text x="900" y="693" fill="#475569" font-size="12" text-anchor="middle">(Moving-average digital filter for ADC signals)</text>

  <!-- Input LDR Parallelogram -->
  <polygon points="170,655 450,655 420,700 140,700" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="295" y="677" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">4 Light Sensors (LDR Module)</text>
  <text x="295" y="693" fill="#64748b" font-size="11" text-anchor="middle">(Top-Left, Top-Right, Bottom-Left, Bottom-Right)</text>
  <line x1="435" y1="677" x2="710" y2="677" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Input Battery Parallelogram -->
  <polygon points="170,720 450,720 420,765 140,765" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="295" y="742" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">18650 Battery Voltage &amp; Energy</text>
  <text x="295" y="758" fill="#64748b" font-size="11" text-anchor="middle">(Measured via ADC Voltage Divider - TP4056)</text>
  <line x1="435" y1="742" x2="710" y2="690" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Input Servo Angle Parallelogram -->
  <polygon points="1370,655 1650,655 1620,700 1340,700" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="1495" y="677" fill="#334155" font-size="12" font-weight="bold" text-anchor="middle">Current Servo Motor Angle</text>
  <text x="1495" y="693" fill="#64748b" font-size="11" text-anchor="middle">(Current position feedback 0° to 180°)</text>
  <line x1="1355" y1="677" x2="1090" y2="677" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>

  <!-- Line Read Sensor -> Q_Auto -->
  <line x1="900" y1="704" x2="900" y2="755" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ================= STAGE 3: MODE & CONTROL LOGIC ================= -->
  <!-- Decision: Is Auto Mode? -->
  <polygon points="900,755 1040,805 900,855 760,805" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="800" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Is system currently in</text>
  <text x="900" y="818" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Automatic Mode (Auto)?</text>

  <!-- Q_Auto -> No (Manual Mode) -->
  <line x1="760" y1="805" x2="250" y2="805" stroke="#1e293b" stroke-width="2"/>
  <line x1="250" y1="805" x2="250" y2="905" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="505" y="797" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">No (Manual Mode)</text>

  <!-- Act Manual -->
  <rect x="100" y="905" width="300" height="60" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="250" y="932" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Adjust Servo Angle Manually</text>
  <text x="250" y="951" fill="#475569" font-size="12" text-anchor="middle">Drive to targetAngle from Web Dashboard (0° - 180°)</text>

  <!-- Q_Auto -> Yes (Auto Mode) -->
  <line x1="900" y1="855" x2="900" y2="905" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="925" y="885" fill="#16a34a" font-size="13" font-weight="bold">Yes</text>

  <!-- Decision: Fault / Low Battery? -->
  <polygon points="900,905 1040,960 900,1015 760,960" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="953" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Low Battery (&lt; 3.3V) or</text>
  <text x="900" y="971" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Sensor/Motor Stalling Fault?</text>

  <!-- Q_Fault -> Yes (Fault Detected) -->
  <line x1="760" y1="960" x2="560" y2="960" stroke="#1e293b" stroke-width="2"/>
  <line x1="560" y1="960" x2="560" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="660" y="952" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">Yes (Fault)</text>

  <!-- Act Fault Stop & Alarm -->
  <rect x="420" y="1055" width="280" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="1079" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">Completely Halt Servo Motor</text>
  <text x="560" y="1097" fill="#ef4444" font-size="12" text-anchor="middle">Enter Safe Standby Mode (Protect battery &amp; load)</text>

  <line x1="560" y1="1107" x2="560" y2="1140" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="420" y="1140" width="280" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <text x="560" y="1163" fill="#b91c1c" font-size="13" font-weight="bold" text-anchor="middle">Send Critical Fault Alert</text>
  <text x="560" y="1181" fill="#ef4444" font-size="12" text-anchor="middle">Push emergency notification to Web Dashboard</text>

  <!-- Q_Fault -> No (Normal) -->
  <line x1="1040" y1="960" x2="1180" y2="960" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1100" y="952" fill="#16a34a" font-size="13" font-weight="bold" text-anchor="middle">No</text>

  <!-- Decision: Is Night? -->
  <polygon points="1280,905 1395,960 1280,1015 1165,960" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1280" y="953" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Ambient Light &lt; Night</text>
  <text x="1280" y="971" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Threshold (Dark)?</text>

  <!-- Q_Night -> Yes (Night Time) -->
  <line x1="1280" y1="1015" x2="1280" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1305" y="1037" fill="#16a34a" font-size="13" font-weight="bold">Yes</text>

  <!-- Act Night East & Sleep -->
  <rect x="1145" y="1055" width="270" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1280" y="1078" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">Return Panel to East Position</text>
  <text x="1280" y="1096" fill="#3b82f6" font-size="12" text-anchor="middle">(Default sunrise alignment ~0°)</text>

  <line x1="1280" y1="1107" x2="1280" y2="1140" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1145" y="1140" width="270" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <text x="1280" y="1163" fill="#1d4ed8" font-size="13" font-weight="bold" text-anchor="middle">Enter Low-Power Sleep Mode</text>
  <text x="1280" y="1181" fill="#3b82f6" font-size="12" text-anchor="middle">(Detach Servo PWM pulses to conserve energy)</text>

  <!-- Q_Night -> No (Daytime Sunshine) -->
  <line x1="1395" y1="960" x2="1485" y2="960" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1440" y="952" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">No</text>

  <!-- Decision: Error >= Deadband? -->
  <polygon points="1585,905 1705,960 1585,1015 1465,960" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="1585" y="953" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">Light Difference &gt;=</text>
  <text x="1585" y="971" fill="#92400e" font-size="12" font-weight="bold" text-anchor="middle">Deadband (|L-R| &gt; ε)?</text>

  <!-- Q_Track -> No (Hold Angle) -->
  <line x1="1515" y1="995" x2="1515" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1480" y="1030" fill="#64748b" font-size="12" font-weight="bold">No</text>

  <rect x="1445" y="1055" width="140" height="56" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="1515" y="1080" fill="#0f172a" font-size="12" font-weight="bold" text-anchor="middle">Hold Current Angle</text>
  <text x="1515" y="1098" fill="#64748b" font-size="11" text-anchor="middle">(Servo idle / steady)</text>

  <!-- Q_Track -> Yes (Track Sun) -->
  <line x1="1645" y1="995" x2="1645" y2="1055" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1655" y="1030" fill="#16a34a" font-size="12" font-weight="bold">Yes</text>

  <rect x="1595" y="1055" width="140" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="1665" y="1080" fill="#15803d" font-size="12" font-weight="bold" text-anchor="middle">Rotate Servo</text>
  <text x="1665" y="1098" fill="#16a34a" font-size="11" text-anchor="middle">(Track maximum light)</text>

  <!-- Merge Hold & Rotate to Battery Monitor -->
  <line x1="1515" y1="1111" x2="1515" y2="1140" stroke="#1e293b" stroke-width="2"/>
  <line x1="1665" y1="1111" x2="1665" y2="1140" stroke="#1e293b" stroke-width="2"/>
  <line x1="1515" y1="1140" x2="1665" y2="1140" stroke="#1e293b" stroke-width="2"/>
  <line x1="1590" y1="1140" x2="1590" y2="1170" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bat Mon Action -->
  <rect x="1445" y="1170" width="290" height="52" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="1590" y="1193" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Monitor Battery Voltage &amp; Charging State</text>
  <text x="1590" y="1211" fill="#475569" font-size="12" text-anchor="middle">Calculate % SOC from ADC, observe TP4056 state</text>

  <!-- ================= STAGE 4: TELEMETRY SYNC BUS ================= -->
  <!-- Horizontal Bus routing lines from all 4 branches down to Telemetry -->
  <line x1="250" y1="965" x2="250" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="560" y1="1192" x2="560" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="1280" y1="1192" x2="1280" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="1590" y1="1222" x2="1590" y2="1285" stroke="#1e293b" stroke-width="2"/>

  <!-- Main horizontal collection bus -->
  <line x1="250" y1="1285" x2="1590" y2="1285" stroke="#1e293b" stroke-width="2"/>
  <line x1="900" y1="1285" x2="900" y2="1325" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision: Is Network Available for Cloud Telemetry? -->
  <polygon points="900,1325 1030,1370 900,1415 770,1370" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="1363" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Wi-Fi &amp; Firebase</text>
  <text x="900" y="1381" fill="#92400e" font-size="13" font-weight="bold" text-anchor="middle">Available &amp; Ready?</text>

  <!-- Q_Net2 -> Yes (Push to Firebase) -->
  <line x1="900" y1="1415" x2="900" y2="1455" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="925" y="1437" fill="#16a34a" font-size="13" font-weight="bold">Yes</text>

  <rect x="680" y="1455" width="440" height="60" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="1481" fill="#15803d" font-size="14" font-weight="bold" text-anchor="middle">Push Telemetry to Firebase RTDB (/telemetry)</text>
  <text x="900" y="1501" fill="#16a34a" font-size="12" text-anchor="middle">Battery Voltage, SOC %, 4 LDR Values, Servo Angle, System State</text>

  <!-- Q_Net2 -> No (Bypass Cloud Push) -->
  <line x1="770" y1="1370" x2="600" y2="1370" stroke="#1e293b" stroke-width="2"/>
  <line x1="600" y1="1370" x2="600" y2="1545" stroke="#1e293b" stroke-width="2"/>
  <text x="670" y="1362" fill="#dc2626" font-size="13" font-weight="bold" text-anchor="middle">No</text>

  <!-- Merge to Delay -->
  <line x1="900" y1="1515" x2="900" y2="1545" stroke="#1e293b" stroke-width="2"/>
  <line x1="600" y1="1545" x2="900" y2="1545" stroke="#1e293b" stroke-width="2"/>
  <line x1="900" y1="1545" x2="900" y2="1575" stroke="#1e293b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop Delay -->
  <rect x="750" y="1575" width="300" height="46" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2" filter="url(#shadow)"/>
  <text x="900" y="1603" fill="#0f172a" font-size="13" font-weight="bold" text-anchor="middle">Sampling Cycle Delay (Delay 500ms - 1s)</text>

  <!-- ================= INFINITE LOOP ROUTING ================= -->
  <!-- Line down from Delay -->
  <line x1="900" y1="1621" x2="900" y2="1670" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Line left across bottom -->
  <line x1="900" y1="1670" x2="70" y2="1670" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Line up along left side -->
  <line x1="70" y1="1670" x2="70" y2="390" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Line right to loop entry point above Q_Net -->
  <line x1="70" y1="390" x2="890" y2="390" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Badge for Infinite loop -->
  <rect x="120" y="1645" width="520" height="34" rx="6" fill="#0284c7" filter="url(#shadow)"/>
  <text x="380" y="1667" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">CONTINUOUS EMBEDDED SYSTEM LOOP (void loop)</text>

</svg>