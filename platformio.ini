; PlatformIO Project Configuration File for SolarController
; Microcontroller: ESP32-S3-WROOM-1 (N16R8: 16MB Octal Flash, 8MB Octal PSRAM)

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; Cấu hình bộ nhớ cho phiên bản N16R8 (16MB Octal Flash + 8MB Octal PSRAM)
; LƯU Ý AN TOÀN: Do dùng Octal OPI bus, các chân GPIO 33, 34, 35, 36, 37 được dùng nội bộ và KHÔNG cắm ngoại vi.
board_build.arduino.memory_type = dio_opi
board_build.flash_mode = dio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Cấu hình Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Build Flags
build_flags = 
    -UCORE_DEBUG_LEVEL
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -D__XTENSA__=1

; Các thư viện phụ thuộc
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
    bblanchon/ArduinoJson @ ^7.0.4
    mobizt/Firebase Arduino Client Library for ESP8266 and ESP32 @ ^4.4.14
